<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pogo Post</title>

<style>
:root{--ink:#2b2340;--o:#ff6b4a;--y:#ffc23d;--b:#3d7bff;--g:#3fbf88;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.dim{background:#2b234055}
.panel{background:var(--card);border-radius:26px;padding:20px 20px 16px;width:min(400px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 var(--ink),0 18px 40px #0003;border:4px solid var(--ink)}
h1{font-size:clamp(30px,9vw,48px);line-height:.95;margin:2px 0 4px;color:var(--o);font-weight:900;letter-spacing:1px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
h2{margin:0 0 8px;font-size:26px;font-weight:900}
.sub{margin:2px 0 10px;font-weight:800;opacity:.75;font-size:15px}
.btn{display:block;width:100%;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0 0;font-weight:900;font-size:21px;font-family:inherit;color:#fff;background:var(--o);box-shadow:0 5px 0 var(--ink);cursor:pointer;position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.sec{background:#8b7bd8;font-size:17px;padding:9px}
.btn.ad{background:var(--g);font-size:17px}
.btn.y{background:var(--y);color:var(--ink)}#fScore{font-size:20px;opacity:1}#fScore b{color:var(--o)}
.btn small{display:block;font-size:13px;opacity:.9}
.row{display:flex;gap:10px}.row .btn{flex:1}
.stars3{font-size:50px;letter-spacing:6px;line-height:1.1;margin:0 0 2px}
.stars3 span{display:inline-block;color:#e6dff0;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.stars3 span.on{color:var(--y);animation:pop .45s both}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.chip{background:#f1ecf6;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900}
.chip.on{background:#ffe08a}
.quip{font-weight:900;font-size:17px;color:#8b5cf6;margin:2px 0 8px;min-height:22px}
.tabs{display:flex;gap:6px;margin:0 0 8px}
.tab{flex:1;border:3px solid var(--ink);border-radius:12px;padding:7px 4px;font-weight:900;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);cursor:pointer}
.tab.on{background:var(--y)}.tab.lock{opacity:.5}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0}
.lvb{aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:900;font-size:20px;color:var(--ink);font-family:inherit;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:0;line-height:1.05}
.lvb{position:relative}.lvb i{position:absolute;top:-8px;right:-7px;font-size:14px;font-style:normal}
.lvb small{display:block;font-size:11px;color:#e0a000;letter-spacing:-1px}
.lvb.boss{background:#ffe9b0}.lvb.lock{background:#eee8f2;color:#b9add0;box-shadow:0 4px 0 #b9add0;border-color:#b9add0;cursor:default}
.lvb.cur{background:#ffd8cc;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.icon-btn{position:fixed;z-index:4;border:3px solid var(--ink);border-radius:14px;width:46px;height:46px;background:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0;font-family:inherit;color:var(--ink);font-weight:900}
#pauseB{top:10px;left:10px}
#muteB{top:10px;left:64px}
.lang{position:fixed;top:12px;right:12px;z-index:6;border:3px solid var(--ink);border-radius:12px;padding:5px 6px;font-weight:800;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
#tip{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:4;max-width:min(380px,90vw);background:#fff;color:var(--ink);font-weight:900;font-size:19px;line-height:1.3;padding:10px 16px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);text-align:center;pointer-events:none;animation:tipIn .3s ease-out}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,10px) scale(.9)}}
.kbd{font-size:13px;opacity:.7;font-weight:800;margin:10px 0 0}
@media (hover:none){.kbd{display:none}}
@media (max-height:500px){#tip{top:auto;bottom:10px;font-size:16px;padding:7px 12px}}
@media (max-height:520px){.panel{padding:12px 16px}.btn{padding:8px;font-size:18px;margin-top:7px}h1{font-size:34px}.stars3{font-size:36px}.lvgrid{grid-template-columns:repeat(10,1fr);gap:5px}.lvb{font-size:15px;border-radius:10px}.panel{width:min(560px,100%)}#mapL .panel{width:min(600px,100%)!important}}
</style>
</head>

<div id="failL" class="layer" hidden><div class="panel">

  <button id="fRetry" class="btn" data-t="retry"></button>

  <button id="fSkip" class="btn y"></button>

</div></div>

<div id="adL" class="layer" hidden style="background:#000c;z-index:9"><div class="panel"><h2>📺</h2><p class="sub" data-t="adTest"></p></div></div>

 for(const fx of [0.5,0.8]){let ok=0;for(let c=0;c<=1.001;c+=0.05){const s=newState(L,1);s.x=pv[0]+pv[1]*fx;s.y=pv[2];s.on=n-1;s.lastP=n-1;s.stack=[{t:'box',crack:0}];
   const C=Math.max(1,Math.round(c*CHARGE_T/DT));for(let k=0;k<C;k++)step(s,L,true);step(s,L,false);for(let k=0;k<500&&s.on<0&&!s.dead;k++)step(s,L,false);if(!s.dead&&s.on===n)ok++}
  best=Math.max(best,ok)}

function genNext(L){const g=L.g,n=L.plats.length,pv=L.plats[n-1],R=()=>rnd(g),zone=n/ZLEN|0,type=zone%3,d=Math.min(1,n/80);

 const cp=n%8===0,dog=!cp&&n>18&&R()<0.14;let p;
 for(let k=0;k<10;k++){const gap=k<9?Math.max(60,70+R()*(70+110*d)-k*10):70,w=cp?260:dog?390:Math.round(Math.max(92,165-65*d+R()*55)),dh=k<9?(R()-0.5)*(110+110*d)*(1-k*0.08):0;
  p=[Math.round(pv[0]+pv[1]+gap),w,Math.round(Math.min(300,Math.max(90,pv[2]+dh))),type];if(k===9||reach(L,p))break}

 if(cp){L.cp[n]=1;const r=R();L.cpPk[n]=n<24?'box':r<0.35?'box':r<0.6?'frag':r<0.82?'cake':'chick'}

function ensure(L,x){while(L.plats[L.plats.length-1][0]<x+1800)genNext(L)}

function rnd(s){s.seed=(s.seed+0x6D2B79F5)|0;let t=s.seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}

function snap(s){s.safe={x:s.x,y:s.y,on:s.on,stack:s.stack.map(p=>({t:p.t,crack:p.crack})),lost:s.lost,score:s.score,combo:s.combo,hits:s.hits,lastP:s.lastP,claim:s.claim.slice(),cpd:s.cpd.slice()}}
function ev(s,k,o){s.ev.push(Object.assign({k},o||{}))}
function stackH(s){let h=0;for(const p of s.stack)h+=PK[p.t].h;return h}
function headPos(s){return{x:s.x+Math.sin(s.th)*HEAD,y:s.y+Math.cos(s.th)*HEAD}}
function dogX(d,t){return d[0]+(d[1]-d[0])*(0.5-0.5*Math.cos(t*d[2]))}
function ropeY(r,x){const k=(x-r[0])/(r[1]-r[0]);return r[2]-r[3]*4*k*(1-k)}
function windAt(L,x){if(!L.winds)return L.wind||0;for(let k=L.winds.length-1;k>=0;k--){const w=L.winds[k];if(x>=w[0])return x<w[1]?w[2]:0}return 0}
function die(s,why){if(s.dead||s.won)return;s.dead=why;ev(s,'crash',{why})}
function loseAt(s,i,why){const p=s.stack[i];if(!p)return;s.stack.splice(i,1);s.lost++;ev(s,'lose',{t:p.t,i,why,dir:Math.sign(s.psi)||1});if(!s.stack.length)die(s,'empty')}
function jump(s){const v=V0+V1*s.charge;s.vx=v*Math.sin(LAUNCH);s.vy=v*Math.cos(LAUNCH);const Tf=2*s.vy/G;
 s.th=0.3;s.om=-(0.3+0.6*s.charge)/Tf;s.on=-1;s.charging=false;s.jumps++;s.airT=0;ev(s,'jump',{c:s.charge})}
function land(s,L,i,pvy){
 const p=L.plats[i];
 for(const tr of L.tramps){if(tr[2]===p[2]&&s.x>=tr[0]-6&&s.x<=tr[0]+tr[1]+6){s.vy=Math.max(-pvy*0.9,TRAMP_V);s.om=-s.th*1.5;s.psv-=0.5;ev(s,'bounce');return}}
 const th=s.th,impact=-pvy;
 if(Math.abs(th)>CRASH_TH){s.y=p[2];die(s,'face');return}
 s.on=i;s.y=p[2];s.vy=0;
 const q=Math.abs(th),hard=q>0.42||impact>1350;
 s.psv+=th*5.5+s.vx*0.0016+(rnd(s)-0.5)*0.5*(impact/900);
 for(let k=s.stack.length-1;k>=0;k--){const pk=s.stack[k];if(pk.t==='frag'&&hard){if(pk.crack){ev(s,'break',{i:k});loseAt(s,k,'break')}else{pk.crack=1;ev(s,'crack',{i:k})}}}
 s.vx=L.rain?s.vx*0.55:0;s.om=-th*2;s.needRel=s.prevHold;
 // bullseye: hit the centre mark before moving on; leaving one behind resets the streak (score only, no physics)
 if(i>s.lastP){for(let k=Math.max(1,s.lastP);k<i;k++)if(L.bull[k]!=null&&!s.claim[k]){if(s.combo>1)ev(s,'cbreak');s.combo=0;break}
  if(L.endless){s.score+=5*(i-s.lastP);if(L.cp[i]&&!s.cpd[i]){s.cpd[i]=1;const b=20*s.stack.length;s.score+=b;let got=null;if(s.stack.length<4){got=L.cpPk[i];s.stack.push({t:got,crack:0})}ev(s,'cp',{i,b,got})}}
  s.lastP=i}
 const bx=L.bull[i];if(bx!=null&&!s.claim[i]&&Math.abs(s.x-bx)<=BULL_R){s.claim[i]=1;s.combo++;s.hits++;if(s.combo>s.maxC)s.maxC=s.combo;const pts=10*s.combo;s.score+=pts;ev(s,'bull',{i,n:s.combo,pts})}

}
function step(s,L,hold){

 if(s.on>=0){
  if(hold&&!s.needRel){if(!s.charging){s.charging=true;s.charge=0;ev(s,'charge')}s.charge=Math.min(1,s.charge+dt/CHARGE_T)}
  else if(s.charging)jump(s);

   if(s.vx){s.x+=s.vx*dt;s.vx*=Math.exp(-1.2*dt);if(Math.abs(s.vx)<5)s.vx=0;const p=L.plats[s.on];if(s.x<p[0]-3||s.x>p[0]+p[1]+3){s.on=-1;s.vy=0;s.om=s.vx*0.004;ev(s,'slip')}}
   const tgt=s.charging?s.charge*0.28:0;s.om+=(-70*(s.th-tgt)-13*s.om)*dt;s.th+=s.om*dt;
  }
 }else{

  for(;k<s.stack.length;k++){const top=base+PK[s.stack[k].t].h*ca;if(top>ry-2&&base<ry+60)break;base=top}

  if(Math.abs(s.psi)>DROP_TH){loseAt(s,s.stack.length-1,'wobble');s.psi*=0.4;s.psv*=0.4}
 }
}

 else if(t==='cake'){c.fillStyle='#ff9cc6';rr(c,-w/2,-h/2+4*z,w,h-4*z,6*z);c.fill();c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(-w/2+2*z,-h/2+6*z);for(let k=0;k<=6;k++){const x=-w/2+2*z+(w-4*z)*k/6;c.quadraticCurveTo(x-3*z,-h/2+(k%2?12:9)*z,x,-h/2+6*z)}c.lineTo(w/2-2*z,-h/2+4*z);c.lineTo(-w/2+2*z,-h/2+4*z);c.fill();
  c.fillStyle='#ffc23d';c.fillRect(-2*z,-h/2-8*z,4*z,12*z);c.strokeRect(-2*z,-h/2-8*z,4*z,12*z);c.fillStyle='#ff6b4a';c.beginPath();c.ellipse(0,-h/2-11*z+Math.sin(GS.time*20)*0.8*z,2.6*z,4*z,0,0,7);c.fill()}
 else if(t==='chick'){const fl=GS.anim.flap>0?Math.sin(GS.time*50)*0.8:0;c.fillStyle='#fff';c.beginPath();c.ellipse(0,2*z,w/2,h/2-1*z,0,0,7);c.fill();c.stroke();

  c.fillStyle='#ff4f6d';c.beginPath();c.arc(8*z,-h/2+1*z,4*z,0,7);c.arc(12*z,-h/2+3*z,3*z,0,7);c.fill();c.fillStyle='#ffc23d';c.beginPath();c.moveTo(w/2-1*z,-1*z);c.lineTo(w/2+6*z,2*z);c.lineTo(w/2-1*z,4*z);c.closePath();c.fill();c.stroke();
  c.fillStyle=INK;c.beginPath();c.arc(8*z,-1*z,2*z,0,7);c.fill()}

/* courier: foot at (x,y), body axis rotated by th */
function drawCourier(c,s,dead){const z=S*GS.cam.z,A=GS.anim;const X=W(s.x),Y=H(s.y)-(GS.mode==='win'&&GS.hopT>0?Math.abs(Math.sin(GS.hopT*11))*16*z:0);
 const ch=s.on>=0&&s.charging?s.charge:0;const sq=Math.max(-0.3,Math.min(0.3,A.sq));const spring=Math.max(0.35,1-ch*0.55+sq*0.6);
 c.save();c.translate(X,Y);
 // shadow on ground
 if(s.on>=0){c.fillStyle='#0002';c.beginPath();c.ellipse(0,0,26*z,6*z,0,0,7);c.fill()}
 c.rotate(s.th);c.lineWidth=LW;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round';
 const sp=18*spring;const peg=-6-sp; // spring from 0 → peg
 // pogo spring
 c.strokeStyle='#8b93a8';c.lineWidth=3.2*z;c.beginPath();for(let k=0;k<=8;k++){const yy=-4-(sp)*k/8;const xx=(k%2?6:-6);k?c.lineTo(xx*z,yy*z):c.moveTo(0,-4*z)}c.stroke();
 c.strokeStyle=INK;c.lineWidth=LW;c.fillStyle='#ff4f6d';rr(c,-3*z,-6*z,6*z,8*z,2*z);c.fill();c.stroke();
 // stick

 c.fillStyle='#c9d3e6';rr(c,-16*z,(bodyY-4)*z,32*z,6*z,3*z);c.fill();c.stroke();
 // legs
 const knee=Math.min(1,ch*1.4+Math.max(0,-sq));c.fillStyle='#3d4f8a';
 for(const d of [-1,1]){c.beginPath();c.moveTo(d*9*z,(bodyY-3)*z);c.lineTo(d*(9+knee*7)*z,(bodyY-14)*z);c.lineTo(d*7*z,(bodyY-26+knee*4)*z);c.lineWidth=7*z;c.strokeStyle=INK;c.stroke();c.lineWidth=4.2*z;c.strokeStyle='#3d4f8a';c.stroke()}
 c.lineWidth=LW;c.strokeStyle=INK;c.fillStyle='#2b2340';for(const d of [-1,1]){rr(c,d*9*z-6*z,(bodyY-4)*z,12*z,5*z,2*z);c.fill()}
 const tb=bodyY-24+knee*4;
 // torso
 c.fillStyle='#ffb02e';rr(c,-14*z,(tb-30)*z,28*z,32*z,9*z);c.fill();c.stroke();
 c.strokeStyle='#8a5a12';c.lineWidth=3*z;c.beginPath();c.moveTo(-12*z,(tb-28)*z);c.lineTo(10*z,(tb-6)*z);c.stroke();c.strokeStyle=INK;c.lineWidth=LW;
 c.fillStyle='#3d7bff';rr(c,-6*z,(tb-20)*z,12*z,9*z,3*z);c.fill();c.stroke();
 // handlebar + arms
 c.fillStyle='#c9d3e6';rr(c,-15*z,(bodyY-58)*z,30*z,6*z,3*z);c.fill();c.stroke();
 c.fillStyle='#ffd2b0';for(const d of [-1,1]){c.beginPath();c.moveTo(d*12*z,(tb-26)*z);c.quadraticCurveTo(d*20*z,(tb-16)*z,d*13*z,(bodyY-55)*z);c.lineWidth=7*z;c.strokeStyle=INK;c.stroke();c.lineWidth=4.2*z;c.strokeStyle='#ffb02e';c.stroke();c.lineWidth=LW;c.strokeStyle=INK;c.beginPath();c.arc(d*13*z,(bodyY-55)*z,4*z,0,7);c.fill();c.stroke()}
 // head
 const hy=tb-30-15;c.fillStyle='#ffd2b0';c.beginPath();c.arc(0,hy*z,15*z,0,7);c.fill();c.stroke();
 c.fillStyle='#3d7bff';c.beginPath();c.arc(0,(hy-2)*z,15*z,Math.PI*1.02,Math.PI*1.98);c.closePath();c.fill();c.stroke();rr(c,4*z,(hy-5)*z,16*z,5*z,2.5*z);c.fill();c.stroke();
 c.fillStyle='#ffc23d';c.beginPath();c.arc(0,(hy-11)*z,3.5*z,0,7);c.fill();
 // face
 const blink=A.blink<0.12;c.fillStyle=INK;c.lineWidth=2.4*z;
 if(dead||A.face){for(const ex of [-3,7]){c.beginPath();c.moveTo((ex-3)*z,(hy-1)*z);c.lineTo((ex+3)*z,(hy+5)*z);c.moveTo((ex+3)*z,(hy-1)*z);c.lineTo((ex-3)*z,(hy+5)*z);c.stroke()}c.beginPath();c.ellipse(3*z,(hy+9)*z,3.5*z,4*z,0,0,7);c.stroke()}
 else{const worried=Math.abs(s.psi)>0.38||(s.on<0&&Math.abs(s.th)>0.45);
  for(const ex of [-3,7]){if(blink){c.beginPath();c.moveTo((ex-2.5)*z,(hy+2)*z);c.lineTo((ex+2.5)*z,(hy+2)*z);c.stroke()}else{c.beginPath();c.arc(ex*z,(hy+2)*z,(worried?3.2:2.5)*z,0,7);c.fill()}}
  c.beginPath();if(worried){c.ellipse(3*z,(hy+9)*z,3*z,2.4*z,0,0,7);c.stroke();c.fillStyle='#7fd8ff';c.beginPath();c.ellipse(-12*z,(hy-6)*z,2.4*z,4*z,0.2,0,7);c.fill()}else{c.arc(3*z,(hy+6)*z,4*z,0.2,Math.PI-0.2);c.stroke()}
  c.fillStyle='#ff7aa866';c.beginPath();c.ellipse(-8*z,(hy+6)*z,3.5*z,2.4*z,0,0,7);c.ellipse(12*z,(hy+6)*z,3.5*z,2.4*z,0,0,7);c.fill()}
 // parcel stack on head (bends with psi)
 if(!dead&&s.stack.length){c.translate(0,(hy-15)*z);const n=s.stack.length;
  for(let i=0;i<n;i++){const p=s.stack[i],h=PK[p.t].h*z;c.rotate(s.psi*(i===0?0.55:0.25/Math.max(1,(n-1)/3)));c.save();c.translate(0,-h/2);drawParcel(c,p.t,z,p.crack,0);c.restore();c.translate(0,-h)}}
 c.restore()}
function drawTiltGauge(c,s){const z=S*GS.cam.z,X=W(s.x),Y=H(s.y)+26*z;const a=s.th,q=Math.abs(a);const col=q<0.15?'#3fbf88':q<0.45?'#ffc23d':'#ff4f6d';
 c.lineWidth=7*z;c.strokeStyle='#ffffffb0';c.beginPath();c.arc(X,Y,30*z,Math.PI*0.15,Math.PI*0.85);c.stroke();
 c.lineWidth=7*z;c.strokeStyle='#3fbf8899';c.beginPath();c.arc(X,Y,30*z,Math.PI*0.5-0.15,Math.PI*0.5+0.15);c.stroke();

function drawCharge(c,s){const z=S*GS.cam.z,X=W(s.x)-44*z,Y=H(s.y)-20*z,h=70*z;c.lineWidth=LW;c.strokeStyle=INK;c.fillStyle='#fff';rr(c,X-7*z,Y-h,14*z,h,7*z);c.fill();c.stroke();
 const k=s.charge;const g=c.createLinearGradient(0,Y,0,Y-h);g.addColorStop(0,'#3fbf88');g.addColorStop(0.6,'#ffc23d');g.addColorStop(1,'#ff4f6d');c.fillStyle=g;rr(c,X-5*z,Y-2*z-(h-4*z)*k,10*z,(h-4*z)*k,5*z);c.fill()}
function drawPreview(c,s,L){const v=V0+V1*s.charge;let x=s.x,y=s.y,vx=v*Math.sin(LAUNCH),vy=v*Math.cos(LAUNCH);const z=S*GS.cam.z;c.fillStyle='#ffffffdd';
 for(let k=0;k<60;k++){for(let j=0;j<4;j++){vy-=G*0.01;x+=vx*0.01;y+=vy*0.01}if(vy<0&&y<s.y-300)break;if(k%2===0){c.beginPath();c.arc(W(x),H(y),3.5*z,0,7);c.fill()}
  let hit=false;if(vy<0)for(const p of L.plats)if(x>=p[0]&&x<=p[0]+p[1]&&y<=p[2]&&y>p[2]-30){hit=true;break}if(hit)break}}
function hud(c){const s=GS.s,L=GS.L;const sz=Math.max(0.8,Math.min(1.2,S*1.1));
 c.textAlign='center';c.lineJoin='round';c.font=`900 ${22*sz}px Nunito,Trebuchet MS,sans-serif`;c.lineWidth=6;c.strokeStyle=INK;c.fillStyle='#fff';
 if(L.endless){const b=GS.bump||0;c.font=`900 ${(32+8*b)*sz}px Nunito,Trebuchet MS,sans-serif`;c.lineWidth=7;const sc=''+(GS.mode==='crash'?GS.endScore:s.score);c.strokeText(sc,CW/2,38*sz+TOPPAD);c.fillStyle=b>0.05?'#ffc23d':'#fff';c.fillText(sc,CW/2,38*sz+TOPPAD);
  c.font=`900 ${15*sz}px Nunito,sans-serif`;c.textAlign='right';c.lineWidth=5;const bt='🏆 '+Math.max(EB,s.score);c.strokeText(bt,CW-14,30*sz);c.fillStyle='#ffe08a';c.fillText(bt,CW-14,30*sz);
  if(s.combo>1){c.textAlign='left';c.font=`900 ${(22+6*b)*sz}px Nunito,sans-serif`;c.lineWidth=6;c.strokeText('×'+s.combo,16,58+26*sz);c.fillStyle='#ff9f43';c.fillText('×'+s.combo,16,58+26*sz)}
  c.textAlign='center'}
 else{const title=(L.boss?'👑 ':'')+T('lvN',{n:L.i+1});c.strokeText(title,CW/2,34*sz+TOPPAD);c.fillText(title,CW/2,34*sz+TOPPAD);
 // timer
 const tv=GS.result&&GS.mode==='win'?GS.result.time:s.t;const tt=tv.toFixed(1);const ok=tv<=L.par;c.font=`900 ${18*sz}px Nunito,sans-serif`;c.textAlign='right';c.strokeText('⏱ '+tt,CW-14,30*sz);c.fillStyle=ok?'#fff':'#ffd0d0';c.fillText('⏱ '+tt,CW-14,30*sz);
 c.font=`800 ${12*sz}px Nunito,sans-serif`;c.lineWidth=4;c.strokeText('★ '+L.par+'s',CW-14,48*sz);c.fillStyle=ok?'#ffc23d':'#ccc';c.fillText('★ '+L.par+'s',CW-14,48*sz)}
 const wnd=windAt(L,s.x);
 // wind badge
 if(wnd){const dir=Math.sign(wnd),n=Math.min(3,Math.ceil(Math.abs(wnd)/40)),bw=78*sz,bh=26*sz,bx=CW-14-bw,by=58*sz;c.save();c.lineWidth=3;c.strokeStyle=INK;c.fillStyle=dir>0?'#bff0d4':'#ffd6cc';rr(c,bx,by,bw,bh,bh/2);c.fill();c.stroke();
  const fx=dir>0?bx+12*sz:bx+bw-12*sz,fl=Math.sin(GS.time*9)*2*sz;c.fillStyle=INK;c.fillRect(fx-1.2*sz,by+5*sz,2.5*sz,bh-10*sz);c.fillStyle='#ff6b4a';c.beginPath();c.moveTo(fx,by+5*sz);c.lineTo(fx+dir*16*sz,by+8*sz+fl);c.lineTo(fx,by+12*sz);c.closePath();c.fill();
  c.strokeStyle=INK;c.lineWidth=3.5*sz;c.lineCap='round';c.lineJoin='round';const cx=bx+bw*(dir>0?0.62:0.38),ph=(GS.time*2)%1;

  c.restore()}

  c.font=`800 ${13*sz}px Nunito,sans-serif`;c.lineWidth=4;const ht=s.hits+'/'+L.nb;c.strokeText(ht,tx,iy+6*sz);c.fillStyle='#fff';c.fillText(ht,tx,iy+6*sz);tx+=c.measureText(ht).width+8*sz;
  if(s.combo>1){c.font=`900 ${17*sz}px Nunito,sans-serif`;c.lineWidth=5;c.strokeText('×'+s.combo,tx,iy+7*sz);c.fillStyle='#ff9f43';c.fillText('×'+s.combo,tx,iy+7*sz)}

 // parcels
