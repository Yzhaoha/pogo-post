<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pogo Post</title>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<style>
:root{--ink:#2b2340;--o:#ff6b4a;--y:#ffc23d;--b:#3d7bff;--g:#3fbf88;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.dim{background:#2b234055}
.panel{background:var(--card);border-radius:26px;padding:20px 20px 16px;width:min(400px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 var(--ink),0 18px 40px #0003;border:4px solid var(--ink)}
h1{font-size:clamp(30px,9vw,48px);line-height:.95;margin:2px 0 4px;color:var(--o);font-weight:900;letter-spacing:1px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
h2{margin:0 0 8px;font-size:26px;font-weight:900}
.tw{display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:100%;height:100%;padding:58px 0 6px;text-align:center}
.tb{width:min(400px,100%)}
#title h1{font-size:clamp(46px,14vw,92px);transform:rotate(-4deg);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink),0 12px 18px #0003;margin:0 0 12px;color:var(--y)}
#title .sub{display:inline-block;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;opacity:1;font-size:14px;margin:0;box-shadow:0 3px 0 var(--ink)}
#title .kbd{display:inline-block;background:#fffdf8cc;border-radius:999px;padding:3px 12px;opacity:1}
@media (max-height:520px){.tw{flex-direction:row;align-items:flex-end;padding:8px 6px}.tl{flex:1;align-self:flex-start;padding-top:44px}#title h1{font-size:clamp(40px,9vw,64px)}.tb{width:min(330px,46%)}}
@media (min-aspect-ratio:4/3) and (min-height:521px){.tw{justify-content:center;gap:4vh;padding:30px 0 60px}.tb{width:min(380px,36vw)}} /* desktop windows: title and buttons together in the middle, like most web games, not down on the rooftops */
.sub{margin:2px 0 10px;font-weight:800;opacity:.75;font-size:15px}
.btn{display:block;width:100%;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin:10px 0 0;font-weight:900;font-size:21px;font-family:inherit;color:#fff;background:var(--o);box-shadow:0 5px 0 var(--ink);cursor:pointer;position:relative}
.btn:disabled{opacity:.45;filter:grayscale(.6);cursor:default}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.goals{margin:10px 0 0;font-weight:800;font-size:14px;line-height:1.5}.goals b{color:var(--o)}.pbar{display:inline-block;vertical-align:middle;width:70px;height:8px;margin-left:8px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}.pbar i{display:block;height:100%;background:var(--y)}
.btn.sec{background:#8b7bd8;font-size:17px;padding:9px}
.btn.ad{background:var(--g);font-size:17px}
.btn.y{background:var(--y);color:var(--ink)}
.cn{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--y);border:2px solid var(--ink);vertical-align:-.06em;margin:0 .22em 0 .1em;box-shadow:inset -2px -2px 0 #e09a00}
.skgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0}
.skb{border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:900;font-size:14px;color:var(--ink);font-family:inherit;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:6px 2px 4px;line-height:1.1}
.skb svg{display:block;margin:0 auto 2px}.skb.own{background:#eef9f3}.skb.on{background:#ffe08a;transform:translateY(-2px)}.skb.no{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}#fScore{font-size:20px;opacity:1}#fScore b{color:var(--o)}
.btn small{display:block;font-size:13px;opacity:.9}
.row{display:flex;gap:10px}.row .btn{flex:1}
.stars3{font-size:50px;letter-spacing:6px;line-height:1.1;margin:0 0 2px}
.stars3 span{display:inline-block;color:#e6dff0;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.stars3 span.on{color:var(--y);animation:pop .45s both}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.chip{background:#f1ecf6;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900}
.chip.on{background:#ffe08a}
.quip{font-weight:900;font-size:17px;color:#8b5cf6;margin:2px 0 8px;min-height:22px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tab{flex:1 1 40%;border:3px solid var(--ink);border-radius:12px;padding:7px 4px;font-weight:900;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);cursor:pointer}
.tab.on{background:var(--y)}.tab.lock{opacity:.6}
.tab.arw{flex:0 0 52px;font-size:18px}.tab.arw:disabled{opacity:.3;cursor:default}.tab.mid{flex:1 1 auto;font-size:16px;line-height:1.15;cursor:default}.tab.mid small{display:block;font-size:11px;opacity:.7}
.lvgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:6px 0}
.lvb{aspect-ratio:1;min-width:0;overflow:visible;white-space:nowrap;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:900;font-size:20px;color:var(--ink);font-family:inherit;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:0;line-height:1.05}
.lvb{position:relative}.lvb i{position:absolute;top:-8px;right:-7px;font-size:14px;font-style:normal}
.lvb small{display:block;font-size:11px;color:#e0a000;letter-spacing:-1px}
.lvb.boss{background:#ffe9b0;font-size:16px;letter-spacing:-1px}.lvb.lock{background:#eee8f2;color:#b9add0;box-shadow:0 4px 0 #b9add0;border-color:#b9add0;cursor:default}
.lvb.cur{background:#ffd8cc;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.icon-btn{position:fixed;z-index:4;border:3px solid var(--ink);border-radius:14px;width:46px;height:46px;background:#fff;font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0;font-family:inherit;color:var(--ink);font-weight:900}
#pauseB{top:10px;left:10px}
#muteB{top:10px;left:64px}
.lang{position:fixed;top:12px;right:12px;z-index:6;border:3px solid var(--ink);border-radius:12px;padding:5px 6px;font-weight:800;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
#tip{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:8;max-width:min(380px,90vw);background:#fff;color:var(--ink);font-weight:900;font-size:17px;line-height:1.3;padding:8px 14px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);text-align:center;pointer-events:none;animation:tipIn .3s ease-out}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,10px) scale(.9)}}
.kbd{font-size:13px;opacity:.7;font-weight:800;margin:10px 0 0}
@media (hover:none){.kbd{display:none}}
@media (max-height:500px){#tip{top:auto;bottom:10px;font-size:16px;padding:7px 12px}}
@media (max-height:520px){.panel{padding:12px 16px}.btn{padding:8px;font-size:18px;margin-top:7px}h1{font-size:34px}.stars3{font-size:36px}.lvgrid{grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}.lvb{font-size:15px;border-radius:10px}.panel{width:min(560px,100%)}#mapL .panel,#shopL .panel{width:min(600px,100%)!important}.skgrid{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:4px 0}.skb svg{height:44px}.skb{padding:3px 2px 2px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="pauseB" class="icon-btn" aria-label="pause" hidden>II</button>
<button id="muteB" class="icon-btn" aria-label="sound">🔊</button>
<select id="lang" class="lang" aria-label="language"></select>
<div id="tip" hidden></div>

<div id="title" class="layer" hidden><div class="tw">
  <div class="tl"><h1 data-t="name"></h1><p class="sub" data-t="tag"></p></div><div class="tb">
  <button id="tPlay" class="btn"><span data-t="play"></span><small id="tLv"></small></button>
  <button id="tEnd" class="btn y"><span data-t="endless"></span><small id="tEb"></small></button>
  <div class="row"><button id="tMap" class="btn sec" data-t="levels"></button><button id="tShop" class="btn sec"><span data-t="shop"></span> · <i class="cn"></i><span id="tCoins"></span></button></div>
  <p class="kbd" data-t="how"></p><p class="kbd" id="tGift" style="margin-top:6px"></p></div>
</div></div>

<div id="mapL" class="layer dim" hidden><div class="panel" style="width:min(440px,100%)">
  <h2 data-t="levels"></h2><div class="tabs" id="mapTabs"></div><p class="sub" id="mapStars" style="margin:0"></p>
  <div class="lvgrid" id="lvGrid"></div><button id="mapBack" class="btn sec" data-t="back"></button>
</div></div>

<div id="shopL" class="layer dim" hidden><div class="panel" style="width:min(440px,100%)">
  <h2 data-t="shop"></h2><p class="sub" style="margin:0;opacity:1"><i class="cn"></i><span id="sCoins"></span></p>
  <div class="skgrid" id="skGrid"></div>
  <button id="sAd" class="btn ad">📺 +60 <i class="cn"></i></button><button id="sBack" class="btn sec" data-t="back"></button>
</div></div>

<div id="pauseL" class="layer dim" hidden><div class="panel">
  <h2 data-t="paused"></h2><p class="sub" id="pSub"></p>
  <button id="pGo" class="btn" data-t="resume"></button>
  <div class="row"><button id="pRetry" class="btn sec" data-t="retry"></button><button id="pMap" class="btn sec" data-t="levels"></button></div>
</div></div>

<div id="winL" class="layer" hidden><div class="panel">
  <h2 id="wT"></h2><div class="stars3" id="wStars"></div><p class="quip" id="wQuip"></p>
  <div class="chips" id="wChips"></div>
  <button id="wNext" class="btn"></button>
  <div class="row"><button id="wRetry" class="btn sec" data-t="retry"></button><button id="wMap" class="btn sec" data-t="levels"></button></div>
</div></div>

<div id="failL" class="layer" hidden><div class="panel">
  <h2 data-t="fail"></h2><p class="quip" id="fQuip"></p><p class="sub" id="fScore" hidden></p>
  <button id="fRetry" class="btn" data-t="retry"></button>
  <button id="fRevive" class="btn ad"></button>
  <button id="fSkip" class="btn y"></button>
  <button id="fMap" class="btn sec" data-t="levels"></button>
</div></div>

<div id="giftL" class="layer dim" hidden style="z-index:8"><div class="panel"><h2>🎁 <span data-t="dailyT"></span></h2><p class="sub" id="gTxt" style="opacity:1;font-size:19px"></p><button id="gOk" class="btn y" data-t="claim"></button></div></div>

<div id="adL" class="layer" hidden style="background:#000c;z-index:9"><div class="panel"><h2>📺</h2><p class="sub" data-t="adTest"></p></div></div>

  if(grit){c.fillStyle='#fff';c.lineWidth=2*z;rr(c,-5.5*z,(hy+10)*z,12*z,6*z,2.5*z);c.fill();c.stroke();c.beginPath();c.moveTo(-1.5*z,(hy+10)*z);c.lineTo(-1.5*z,(hy+16)*z);c.moveTo(2.5*z,(hy+10)*z);c.lineTo(2.5*z,(hy+16)*z);c.stroke();
   if(worried){c.fillStyle='#7fd8ff';c.lineWidth=1.6*z;c.beginPath();c.moveTo(-15*z,(hy-4)*z);c.quadraticCurveTo(-18.5*z,(hy+2)*z,-15*z,(hy+3)*z);c.quadraticCurveTo(-11.5*z,(hy+2)*z,-15*z,(hy-4)*z);c.fill();c.stroke()}}
  else{c.lineWidth=2.4*z;c.fillStyle='#b03a4c';c.beginPath();c.arc(0.5*z,(hy+10.5)*z,4.8*z,0.1,Math.PI-0.1);c.closePath();c.fill();c.stroke()}}
 c.lineWidth=LW;c.strokeStyle=INK;
 // parcel stack on head (bends with psi)
 if(!dead&&s.stack.length){c.translate(0,(hy-R)*z);const n=s.stack.length;
  for(let i=0;i<n;i++){const p=s.stack[i],h=PK[p.t].h*z;c.rotate(s.psi*(i===0?0.55:0.25/Math.max(1,(n-1)/3)));c.save();c.translate(0,-h/2);drawParcel(c,p.t,z,p.crack,0);c.restore();c.translate(0,-h)}}

// the control to press, drawn as a key cap that keeps pressing itself down (space bar / mouse / screen, whichever the player is using)
function drawKeyHint(c,s){const z=S*GS.cam.z,inp=GS.inp||(matchMedia('(pointer:coarse)').matches?'touch':'key');
 const lab=inp==='key'?T('spaceKey'):inp==='mouse'?T('holdMouse'):T('holdScreen'),fz=GS.freeze,top=fz?T(inp==='key'?'balKey':inp==='mouse'?'balMouse':'balScreen'):T('holdAir');const fs=Math.max(16,(fz?28:22)*z);c.save();c.font=`900 ${fs}px Nunito,Trebuchet MS,sans-serif`;
 const w=Math.max(c.measureText(lab).width+fs*1.6,inp==='key'?fs*7:0),h=fs*1.9,d=fs*0.35,X=fz?CW/2-w/2:Math.max(8,Math.min(CW-8-w,W(s.x)-w/2)),Y=fz?CH*0.3:H(s.y+HEAD+stackH(s)+40)-h-d;
 const ph=(GS.time*1.6)%1,down=ph>0.18&&ph<0.85?1:0,off=down*d*0.8;
 c.fillStyle=INK;rr(c,X,Y+d,w,h,h*0.28);c.fill();                        // key side
 c.fillStyle=down?'#ffe08a':'#ffffff';c.strokeStyle=INK;c.lineWidth=3;rr(c,X,Y+off,w,h,h*0.28);c.fill();c.stroke();
 c.fillStyle=INK;c.textAlign='center';c.textBaseline='middle';c.fillText(lab,X+w/2,Y+off+h/2+1);
 c.font=`900 ${fs*0.8}px Nunito,Trebuchet MS,sans-serif`;c.lineWidth=5;c.strokeStyle=INK;c.fillStyle='#ffc23d';let tf=fs*(fz?0.95:0.8);c.font=`900 ${tf}px Nunito,Trebuchet MS,sans-serif`;const tw=c.measureText(top).width;if(tw>CW-24){tf*=(CW-24)/tw;c.font=`900 ${tf}px Nunito,Trebuchet MS,sans-serif`}
 const tx=Math.max(12+Math.min(tw,CW-24)/2,Math.min(CW-12-Math.min(tw,CW-24)/2,X+w/2));c.strokeText(top,tx,Y-fs*0.8);c.fillText(top,tx,Y-fs*0.8);
 c.restore()}
function drawTiltGauge(c,s){const z=S*GS.cam.z,X=W(s.x),Y=H(s.y)+26*z;const a=s.th,q=Math.abs(a);const col=q<0.15?'#3fbf88':q<0.45?'#ffc23d':'#ff4f6d';
 c.lineWidth=7*z;c.strokeStyle='#ffffffb0';c.beginPath();c.arc(X,Y,30*z,Math.PI*0.15,Math.PI*0.85);c.stroke();
 c.lineWidth=7*z;c.strokeStyle='#3fbf8899';c.beginPath();c.arc(X,Y,30*z,Math.PI*0.5-0.15,Math.PI*0.5+0.15);c.stroke();
 const ang=Math.PI*0.5-Math.max(-1.2,Math.min(1.2,a));c.fillStyle=col;c.strokeStyle=INK;c.lineWidth=2*z;c.beginPath();c.arc(X+Math.cos(ang)*30*z,Y+Math.sin(ang)*30*z,6*z,0,7);c.fill();c.stroke()}
function drawCharge(c,s){const z=S*GS.cam.z,X=W(s.x)-44*z,Y=H(s.y)-20*z,h=70*z;c.lineWidth=LW;c.strokeStyle=INK;c.fillStyle='#fff';
 if(s.charge>=1){const a=0.5+0.5*Math.sin(GS.time*28);c.save();c.shadowColor='#fff';c.shadowBlur=14*z*a;c.strokeStyle=`rgba(255,79,109,${0.5+0.5*a})`;c.lineWidth=LW*2.2;rr(c,X-7*z,Y-h,14*z,h,7*z);c.stroke();c.restore()}
 rr(c,X-7*z,Y-h,14*z,h,7*z);c.fill();c.stroke();
 const k=s.charge;const g=c.createLinearGradient(0,Y,0,Y-h);g.addColorStop(0,'#3fbf88');g.addColorStop(0.6,'#ffc23d');g.addColorStop(1,'#ff4f6d');c.fillStyle=g;rr(c,X-5*z,Y-2*z-(h-4*z)*k,10*z,(h-4*z)*k,5*z);c.fill()}
function drawPreview(c,s,L,full){ // aim guide: full arc in the first 3 levels; elsewhere a tapering arc that covers ~70% of the flight, so the landing spot stays a judgement call
 const v=V0+V1*s.charge;let x=s.x,y=s.y,vx=v*Math.sin(LAUNCH),vy=v*Math.cos(LAUNCH);const z=S*GS.cam.z,lim=full?99:AIM_F*2*vy/G,GAP=22,SKIP=46;
 let t=0,d=0,next=SKIP,pts=[];
 for(let k=0;k<400&&t<lim;k++){vy-=G*0.01;const nx=x+vx*0.01,ny=y+vy*0.01;d+=Math.hypot(nx-x,ny-y);x=nx;y=ny;t+=0.01;
  if(vy<0&&y<s.y-300)break;let hit=false;if(vy<0)for(const p of L.plats)if(x>=p[0]&&x<=p[0]+p[1]&&y<=p[2]&&y>p[2]-30){hit=true;break}
  if(d>=next){pts.push([x,y]);next+=GAP}if(hit)break}
 c.fillStyle='#ffffff';c.strokeStyle='#2b2340';const n=pts.length;
 for(let i=0;i<n;i++){const f=full?0:i/Math.max(1,n-1);c.globalAlpha=1-0.75*f;c.lineWidth=1.6*z;c.beginPath();c.arc(W(pts[i][0]),H(pts[i][1]),(6-3*f)*z,0,7);c.fill();c.stroke()}
 c.globalAlpha=1}
function hud(c){const s=GS.s,L=GS.L;const sz=Math.max(1,Math.min(1.25,S*1.1)); // >=1 keeps the small HUD text legible in an 800x450 iframe
 c.textAlign='center';c.lineJoin='round';c.font=`900 ${22*sz}px Nunito,Trebuchet MS,sans-serif`;c.lineWidth=6;c.strokeStyle=INK;c.fillStyle='#fff';
 if(L.endless){const b=GS.bump||0;c.font=`900 ${(32+8*b)*sz}px Nunito,Trebuchet MS,sans-serif`;c.lineWidth=7;const sc=''+(GS.mode==='crash'?GS.endScore:s.score);c.strokeText(sc,CW/2,38*sz+TOPPAD);c.fillStyle=b>0.05?'#ffc23d':'#fff';c.fillText(sc,CW/2,38*sz+TOPPAD);
  c.font=`900 ${15*sz}px Nunito,sans-serif`;c.textAlign='right';c.lineWidth=5;const bt='🏆 '+Math.max(EB,s.score);c.strokeText(bt,CW-14,30*sz);c.fillStyle='#ffe08a';c.fillText(bt,CW-14,30*sz);
  if(s.combo>1){c.textAlign='left';c.font=`900 ${(22+6*b)*sz}px Nunito,sans-serif`;c.lineWidth=6;c.strokeText('×'+s.combo,16,58+26*sz);c.fillStyle='#ff9f43';c.fillText('×'+s.combo,16,58+26*sz)}
  c.textAlign='center'}
 else{const title=(L.boss?'👑 ':'')+T('lvN',{n:L.i+1});c.strokeText(title,CW/2,34*sz+TOPPAD);c.fillText(title,CW/2,34*sz+TOPPAD);
 // timer
 const tv=GS.result&&GS.mode==='win'?GS.result.time:s.t;const tt=tv.toFixed(1);const ok=tv<=L.par;c.font=`900 ${18*sz}px Nunito,sans-serif`;c.textAlign='right';c.strokeText('⏱ '+tt,CW-14,30*sz);c.fillStyle=ok?'#fff':'#ffd0d0';c.fillText('⏱ '+tt,CW-14,30*sz);
 c.font=`800 ${12*sz}px Nunito,sans-serif`;c.lineWidth=4;c.strokeText('★ '+L.par+'s',CW-14,48*sz);c.fillStyle=ok?'#ffc23d':'#ccc';c.fillText('★ '+L.par+'s',CW-14,48*sz)}
 // 3-star goals, shown for ~3 s when a level is first opened
 if(!L.endless&&GS.goalAt!=null&&GS.goalLv===L.i){const age=GS.time-GS.goalAt,D=3.2;if(age>=0&&age<D){c.save();c.globalAlpha=Math.max(0,Math.min(1,age/0.25,(D-age)/0.5));
  const parts=[T('st1'),T('st2'),T('st3',{n:L.par})];c.textAlign='left';c.textBaseline='middle';
  let fs=15*sz,sw,gap,ws,tw;const meas=()=>{c.font=`800 ${fs}px Nunito,Trebuchet MS,sans-serif`;sw=c.measureText('★ ').width;gap=fs*1.2;ws=parts.map(t=>c.measureText(t).width);tw=ws.reduce((x,y)=>x+y,0)+parts.length*sw+gap*(parts.length-1)};meas();
  if(tw+2*fs>CW-16){fs*=(CW-16)/(tw+2*fs);meas()} // shrink to fit narrow phones
  const ph=fs*2,pw=tw+2*fs,px=CW/2-pw/2,py=(CW<640?104:78)*sz+TOPPAD;/* phones: below the bullseye counter */c.lineWidth=3;c.strokeStyle=INK;c.fillStyle='rgba(255,255,255,0.92)';rr(c,px,py,pw,ph,ph/2);c.fill();c.stroke();
  let x=px+fs;const y=py+ph/2+1;parts.forEach((t,k)=>{c.fillStyle='#ffb300';c.fillText('★ ',x,y);x+=sw;c.fillStyle=INK;c.fillText(t,x,y);x+=ws[k]+gap});c.restore()}}
 const wnd=windAt(L,s.x,s.t);
 // wind badge
 if(wnd){const dir=Math.sign(wnd),n=Math.min(3,Math.ceil(Math.abs(wnd)/40)),bw=78*sz,bh=26*sz,bx=CW-14-bw,by=58*sz;c.save();c.lineWidth=3;c.strokeStyle=INK;c.fillStyle=dir>0?'#bff0d4':'#ffd6cc';rr(c,bx,by,bw,bh,bh/2);c.fill();c.stroke();
  const fx=dir>0?bx+12*sz:bx+bw-12*sz,fl=Math.sin(GS.time*9)*2*sz;c.fillStyle=INK;c.fillRect(fx-1.2*sz,by+5*sz,2.5*sz,bh-10*sz);c.fillStyle='#ff6b4a';c.beginPath();c.moveTo(fx,by+5*sz);c.lineTo(fx+dir*16*sz,by+8*sz+fl);c.lineTo(fx,by+12*sz);c.closePath();c.fill();
  c.strokeStyle=INK;c.lineWidth=3.5*sz;c.lineCap='round';c.lineJoin='round';const cx=bx+bw*(dir>0?0.62:0.38),ph=(GS.time*2)%1;
  for(let k=0;k<n;k++){const ox=(k-(n-1)/2)*11*sz+dir*ph*3*sz;c.beginPath();c.moveTo(cx+ox-dir*4*sz,by+7*sz);c.lineTo(cx+ox+dir*4*sz,by+bh/2);c.lineTo(cx+ox-dir*4*sz,by+bh-7*sz);c.stroke()}
  c.restore()}
 // bullseye score (left, under the buttons)
 if(L.nb&&!L.endless){const b=GS.bump||0,ix=22,iy=58+20*sz,r=9*sz;c.save();c.lineWidth=2.5;c.strokeStyle=INK;
  [[1,'#ff4f6d'],[0.62,'#fff'],[0.28,'#ff4f6d']].forEach(([k,col],j)=>{c.fillStyle=col;c.beginPath();c.arc(ix,iy,r*k,0,7);c.fill();if(!j)c.stroke()});
  c.textAlign='left';c.lineJoin='round';c.lineWidth=6;c.font=`900 ${(21+7*b)*sz}px Nunito,Trebuchet MS,sans-serif`;const st=''+s.score;let tx=ix+r+7*sz;c.strokeText(st,tx,iy+7*sz);c.fillStyle=b>0.05?'#ffc23d':'#fff';c.fillText(st,tx,iy+7*sz);tx+=c.measureText(st).width+8*sz;
  c.font=`800 ${13*sz}px Nunito,sans-serif`;c.lineWidth=4;const ht=s.hits+'/'+L.nb;c.strokeText(ht,tx,iy+6*sz);c.fillStyle='#fff';c.fillText(ht,tx,iy+6*sz);tx+=c.measureText(ht).width+8*sz;
  if(s.combo>1){c.font=`900 ${17*sz}px Nunito,sans-serif`;c.lineWidth=5;c.strokeText('×'+s.combo,tx,iy+7*sz);c.fillStyle='#ff9f43';c.fillText('×'+s.combo,tx,iy+7*sz)}
  c.restore()}
 // parcels
 const tot=L.endless?s.stack.length:L.pk.length;let x=CW/2-(tot-1)*17*sz;const y=(L.endless?68:62)*sz+TOPPAD;

 c.globalAlpha=1}
